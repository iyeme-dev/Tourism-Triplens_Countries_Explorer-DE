volumes:
  minio_data:
  minio_config:

networks:
  triplens:

services:
  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z-cpuv1
    container_name: minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-adminadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-12345678}

    ports:
      - "9000:9000"
      - "9001:9001"

    restart: unless-stopped
    env_file:
      - .env

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data
      - minio_config:/root/.minio

    networks:
      - triplens